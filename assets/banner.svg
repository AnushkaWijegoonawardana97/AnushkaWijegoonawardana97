<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
  <title id="title">Anushka Wijegoonawardana - Tech Lead, AI-first engineer</title>
  <desc id="desc">Profile banner for Anushka Wijegoonawardana, Tech Lead and senior full-stack engineer based in Colombo.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="stop-a"/>
      <stop offset="0.55" class="stop-b"/>
      <stop offset="1" class="stop-c"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" class="ink-a"/>
      <stop offset="1" class="ink-b"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="wire-a"/>
      <stop offset="1" class="wire-b"/>
    </linearGradient>
    <radialGradient id="orb" cx="78%" cy="28%" r="42%">
      <stop offset="0" class="orb-a"/>
      <stop offset="1" class="orb-b"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" class="grid" fill="none" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    .bg { fill: #F6F1E8; }
    .panel { fill: #FFFDF8; stroke: #D9D1C3; }
    .stop-a { stop-color: #F6F1E8; }
    .stop-b { stop-color: #E7F6F3; }
    .stop-c { stop-color: #E7E0F8; }
    .ink-a { stop-color: #12202B; }
    .ink-b { stop-color: #2A1F4A; }
    .wire-a { stop-color: #0F766E; }
    .wire-b { stop-color: #6D28D9; }
    .orb-a { stop-color: #2DD4BF; stop-opacity: .26; }
    .orb-b { stop-color: #2DD4BF; stop-opacity: 0; }
    .grid { stroke: #12202B; stroke-opacity: .06; }
    .kicker, .meta, .node-label { fill: #3F4A55; }
    .name { fill: url(#ink); }
    .chip { fill: #12202B; }
    .chip-text { fill: #F6F1E8; }
    .node { fill: #FFFDF8; stroke: #0F766E; }
    .node-core { fill: #0F766E; }
    .wire { stroke: url(#wire); }
    .pulse { fill: #0F766E; opacity: .18; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #090C12; }
      .panel { fill: #10151E; stroke: #2A3340; }
      .stop-a { stop-color: #090C12; }
      .stop-b { stop-color: #102027; }
      .stop-c { stop-color: #171328; }
      .ink-a { stop-color: #F4EFE6; }
      .ink-b { stop-color: #C4B5FD; }
      .wire-a { stop-color: #2EE6D6; }
      .wire-b { stop-color: #A78BFA; }
      .orb-a { stop-color: #2EE6D6; stop-opacity: .2; }
      .orb-b { stop-color: #2EE6D6; stop-opacity: 0; }
      .grid { stroke: #F4EFE6; stroke-opacity: .05; }
      .kicker, .meta, .node-label { fill: #B7C0CC; }
      .chip { fill: #F4EFE6; }
      .chip-text { fill: #090C12; }
      .node { fill: #10151E; stroke: #2EE6D6; }
      .node-core { fill: #2EE6D6; }
      .pulse { fill: #2EE6D6; opacity: .2; }
    }

    .pulse {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulse 3.2s ease-in-out infinite;
    }
    .pulse.delay { animation-delay: 1.1s; }
    .float { animation: float 6s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: .12; transform: scale(1); }
      50% { opacity: .3; transform: scale(1.45); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
  </style>

  <rect class="bg" width="1100" height="300"/>
  <rect width="1100" height="300" fill="url(#wash)"/>
  <rect width="1100" height="300" fill="url(#grid)"/>
  <circle cx="920" cy="70" r="150" fill="url(#orb)" class="float"/>
  <rect class="panel" x="22" y="22" width="1056" height="256" rx="26"/>

  <text class="kicker" x="56" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">TECH LEAD  /  COLOMBO, SRI LANKA</text>
  <text class="name" x="56" y="140" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="44" font-weight="700">Anushka Wijegoonawardana</text>
  <text class="meta" x="56" y="180" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18">I architect products, then ship them with agents in the loop.</text>

  <g>
    <rect class="chip" x="56" y="214" width="186" height="34" rx="17"/>
    <text class="chip-text" x="149" y="236" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">Eventbook / Aug 2025</text>
    <rect class="chip" x="252" y="214" width="186" height="34" rx="17"/>
    <text class="chip-text" x="345" y="236" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">WireApps / Jan 2024</text>
    <rect class="chip" x="448" y="214" width="132" height="34" rx="17"/>
    <text class="chip-text" x="514" y="236" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">AI-first desk</text>
  </g>

  <g class="float">
    <path class="wire" d="M790 108 C828 108, 846 146, 884 146 S940 108, 978 108" fill="none" stroke-width="1.8"/>
    <path class="wire" d="M884 78 V146" fill="none" stroke-width="1.8"/>
    <path class="wire" d="M790 184 C828 184, 846 146, 884 146 S940 184, 978 184" fill="none" stroke-width="1.8"/>

    <g transform="translate(790 108)">
      <circle class="pulse" r="15"/>
      <circle class="node" r="10" stroke-width="1.8"/>
      <circle class="node-core" r="3.2"/>
      <text class="node-label" x="0" y="30" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12">plan</text>
    </g>
    <g transform="translate(978 108)">
      <circle class="pulse delay" r="15"/>
      <circle class="node" r="10" stroke-width="1.8"/>
      <circle class="node-core" r="3.2"/>
      <text class="node-label" x="0" y="30" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12">review</text>
    </g>
    <g transform="translate(884 78)">
      <circle class="node" r="10" stroke-width="1.8"/>
      <circle class="node-core" r="3.2"/>
      <text class="node-label" x="0" y="-16" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12">orch</text>
    </g>
    <g transform="translate(790 184)">
      <circle class="node" r="10" stroke-width="1.8"/>
      <circle class="node-core" r="3.2"/>
      <text class="node-label" x="0" y="30" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12">challenge</text>
    </g>
    <g transform="translate(978 184)">
      <circle class="pulse" r="15"/>
      <circle class="node" r="10" stroke-width="1.8"/>
      <circle class="node-core" r="3.2"/>
      <text class="node-label" x="0" y="30" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12">ship</text>
    </g>
    <g transform="translate(884 146)">
      <circle class="node" r="12" stroke-width="2"/>
      <circle class="node-core" r="3.8"/>
      <text class="node-label" x="0" y="34" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12">human</text>
    </g>
  </g>
</svg>
